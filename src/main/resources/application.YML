spring:
  application:
    name: GestionInventarios
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.orm.connections.AbstractConnectionProvider: DEBUG
    org.hibernate.cfg.AnnotationBinder: DEBUG

server:
  port: 5000

jwt:
  secret: ${JWT_SECRET:miClaveSecretaSuperSeguraParaJWT123456789}
  expiration: ${JWT_EXPIRATION:86400}

admin:
  email: ${ADMIN_EMAIL:admin@gestioninventarios.com}
  password: ${ADMIN_PASSWORD:Admin123456}